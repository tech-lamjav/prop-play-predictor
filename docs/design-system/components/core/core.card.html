<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--canvas);font-family:var(--font-sans);color:var(--ink)}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:600;color:var(--ink-2);margin:0 0 10px}
  .grp{margin-bottom:22px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Button, Badge, Card, CardHeader, Input, Switch, Tabs } = window.SmartBettingDesignSystem_c8cd28;
function Demo(){
  const [sort,setSort] = React.useState("score");
  return (<div>
    <div className="grp"><p className="lbl">Buttons</p>
      <div className="row">
        <Button variant="forest">Abrir análise</Button>
        <Button variant="amber">Ver oportunidades</Button>
        <Button variant="outline-forest">Filtrar</Button>
        <Button variant="secondary">Cancelar</Button>
        <Button variant="ghost">Depois</Button>
        <Button variant="destructive">Remover</Button>
        <Button variant="forest" disabled>Indisponível</Button>
      </div>
      <div className="row" style={{marginTop:10}}>
        <Button variant="forest" size="sm">Small</Button>
        <Button variant="forest" size="default">Default</Button>
        <Button variant="forest" size="lg">Large</Button>
      </div>
    </div>
    <div className="grp"><p className="lbl">Badges</p>
      <div className="row">
        <Badge tone="forest">3★</Badge>
        <Badge tone="amber">Destaque</Badge>
        <Badge tone="success">+15% edge</Badge>
        <Badge tone="warning" square>OUT</Badge>
        <Badge tone="danger" square>DTD</Badge>
        <Badge tone="info">B2B</Badge>
        <Badge tone="neutral">Pontos</Badge>
        <Badge tone="outline">Linha 24.5</Badge>
      </div>
    </div>
    <div className="grp"><p className="lbl">Input · Switch · Tabs</p>
      <div className="row">
        <div style={{width:260}}><Input placeholder="Buscar jogador..." /></div>
        <Switch defaultChecked />
        <Tabs items={[{label:"Por Score",value:"score"},{label:"Por Gatilho",value:"trigger"}]} value={sort} onChange={setSort} />
      </div>
    </div>
    <div className="grp"><p className="lbl">Card</p>
      <Card interactive style={{maxWidth:320}}>
        <CardHeader eyebrow="Jogos de hoje" title="4 partidas" action={<a href="#" style={{fontSize:12,fontWeight:600}}>Ver todos ›</a>} />
        <div style={{fontSize:13,color:"var(--ink-2)"}}>Todas com análise de oportunidades.</div>
      </Card>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body></html>
