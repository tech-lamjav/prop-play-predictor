<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans)}
  .grid{display:flex;gap:16px;align-items:stretch}
  .tile{flex:1;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:120px}
  .cap{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--ink-2)}
  img{display:block}
</style></head><body>
<div class="grid">
  <div class="tile" style="background:#fff"><img src="../../assets/logo-full.png" alt="Smart Betting" style="height:52px"><div class="cap">Primary · on light</div></div>
  <div class="tile" style="background:#fff"><img src="../../assets/logo-mark.png" alt="mark" style="height:56px"><div class="cap">Mark only</div></div>
  <div class="tile" style="background:var(--forest)"><img src="../../assets/logo-white.png" alt="Smart Betting" style="height:48px"><div class="cap" style="color:rgba(255,255,255,.7)">Reversed · on forest</div></div>
</div>
</body></html>
