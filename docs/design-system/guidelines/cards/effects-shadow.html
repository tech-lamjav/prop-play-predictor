<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Used sparingly — border+color is the default" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--ink)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .sw .chip{height:56px}
  .sw .meta{padding:6px 8px;background:#fff}
  .sw .nm{font-size:11px;font-weight:600;letter-spacing:-.01em}
  .sw .hx{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:1px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--ink-2)}
</style></head><body><div class="row" style="gap:20px">
<div style="text-align:center"><div style="width:120px;height:70px;background:#fff;border:1px solid #e3e6e0;border-radius:14px"></div><div style="font-size:10px;color:#5a625a;margin-top:8px">border only<br>(default)</div></div>
<div style="text-align:center"><div style="width:120px;height:70px;background:#fff;border:1px solid #e3e6e0;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)"></div><div style="font-size:10px;color:#5a625a;margin-top:8px">card-hover</div></div>
<div style="text-align:center"><div style="width:120px;height:70px;background:#fff;border-radius:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.15)"></div><div style="font-size:10px;color:#5a625a;margin-top:8px">pop (dropdown)</div></div>
<div style="text-align:center"><div style="width:120px;height:70px;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.12)"></div><div style="font-size:10px;color:#5a625a;margin-top:8px">elevated (rare)</div></div>
</div></body></html>
