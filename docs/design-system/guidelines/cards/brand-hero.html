<!-- @dsCard group="Brand" viewport="700x230" name="Hero surface" subtitle="Forest gradient + amber radial glow — the signature hero treatment" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans)}
  .hero{position:relative;overflow:hidden;border-radius:24px;padding:28px 32px;color:#fff;background:var(--gradient-hero)}
  .glow{position:absolute;top:0;right:0;width:280px;height:280px;border-radius:50%;pointer-events:none;background:var(--gradient-hero-glow);transform:translate(80px,-80px)}
  .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;color:var(--ink);background:var(--amber-bright);display:inline-block;padding:5px 10px;border-radius:8px}
  h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:16px 0 0;line-height:1.2}
  .sub{color:rgba(255,255,255,.82);font-size:14px;margin-top:8px}
  .score{position:absolute;right:32px;bottom:22px;font-size:64px;font-weight:600;letter-spacing:-.02em;color:var(--amber-bright);font-variant-numeric:tabular-nums;line-height:1}
</style></head><body>
<div class="hero">
  <div class="glow"></div>
  <span class="eyebrow">Destaque do dia</span>
  <h1>Reaves rende +34% em pontos<br>quando Luka fica fora</h1>
  <div class="sub">Projeção 28.4 · linha 24.5 · vantagem +15%</div>
  <div class="score">87</div>
</div>
</body></html>
