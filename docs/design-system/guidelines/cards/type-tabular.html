<!-- @dsCard group="Type" viewport="700x160" name="Tabular numbers" subtitle="tnum on all money / odds / scores / stats" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--ink)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .sw .chip{height:56px}
  .sw .meta{padding:6px 8px;background:#fff}
  .sw .nm{font-size:11px;font-weight:600;letter-spacing:-.01em}
  .sw .hx{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:1px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--ink-2)}
</style></head><body><div class="lbl">Aligned columns (font-variant-numeric: tabular-nums)</div>
<table style="border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums;font-size:15px">
<tr><td style="padding:3px 24px 3px 0;color:#5a625a">Média</td><td style="font-weight:600">21.3</td></tr>
<tr><td style="padding:3px 24px 3px 0;color:#5a625a">Projeção</td><td style="font-weight:600;color:#0a3d2e">28.4</td></tr>
<tr><td style="padding:3px 24px 3px 0;color:#5a625a">Vantagem</td><td style="font-weight:600;color:#d4a017">+15%</td></tr>
</table></body></html>
