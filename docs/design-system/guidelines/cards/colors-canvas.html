<!-- @dsCard group="Colors" viewport="700x150" name="Canvas & surfaces" subtitle="Off-white page + card surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--ink)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .sw .chip{height:56px}
  .sw .meta{padding:6px 8px;background:#fff}
  .sw .nm{font-size:11px;font-weight:600;letter-spacing:-.01em}
  .sw .hx{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:1px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--ink-2)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#f6f7f5"></div><div class="meta"><div class="nm">canvas</div><div class="hx">#f6f7f5</div></div></div><div class="sw"><div class="chip" style="background:#eef0eb"></div><div class="meta"><div class="nm">canvas-2</div><div class="hx">#eef0eb</div></div></div><div class="sw"><div class="chip" style="background:#ffffff"></div><div class="meta"><div class="nm">white</div><div class="hx">#ffffff</div></div></div><div class="sw"><div class="chip" style="background:#eef0ec"></div><div class="meta"><div class="nm">ink-3</div><div class="hx">#eef0ec</div></div></div></div></body></html>
