<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--ink)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .sw .chip{height:56px}
  .sw .meta{padding:6px 8px;background:#fff}
  .sw .nm{font-size:11px;font-weight:600;letter-spacing:-.01em}
  .sw .hx{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:1px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--ink-2)}
</style></head><body><div class="row" style="align-items:flex-end">
<div style="text-align:center"><div style="width:72px;height:56px;background:#fff;border:1px solid #e3e6e0;border-radius:6px"></div><div style="font-size:10px;color:#5a625a;margin-top:6px">sm<br>6px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:#fff;border:1px solid #e3e6e0;border-radius:10px"></div><div style="font-size:10px;color:#5a625a;margin-top:6px">md<br>10px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:#fff;border:1px solid #e3e6e0;border-radius:14px"></div><div style="font-size:10px;color:#5a625a;margin-top:6px">lg<br>14px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:#fff;border:1px solid #e3e6e0;border-radius:20px"></div><div style="font-size:10px;color:#5a625a;margin-top:6px">xl<br>20px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:#fff;border:1px solid #e3e6e0;border-radius:24px"></div><div style="font-size:10px;color:#5a625a;margin-top:6px">2xl<br>24px</div></div>
</div></body></html>
