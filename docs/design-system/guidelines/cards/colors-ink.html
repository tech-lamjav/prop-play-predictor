<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--ink)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .sw .chip{height:56px}
  .sw .meta{padding:6px 8px;background:#fff}
  .sw .nm{font-size:11px;font-weight:600;letter-spacing:-.01em}
  .sw .hx{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:1px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--ink-2)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#1a1d1a"></div><div class="meta"><div class="nm">ink</div><div class="hx">#1a1d1a</div></div></div><div class="sw"><div class="chip" style="background:#5a625a"></div><div class="meta"><div class="nm">ink-2</div><div class="hx">#5a625a</div></div></div><div class="sw"><div class="chip" style="background:#9aa097"></div><div class="meta"><div class="nm">ink-dim</div><div class="hx">#9aa097</div></div></div></div>
<div class="lbl" style="margin-top:14px">Text on canvas</div>
<div style="margin-top:6px"><span style="color:#1a1d1a;font-weight:600">Primary heading</span> · <span style="color:#5a625a">muted body</span> · <span style="color:#9aa097">hint</span></div></body></html>
