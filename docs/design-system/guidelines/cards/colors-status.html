<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Semantic feedback — warm but never garish" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--ink)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .sw .chip{height:56px}
  .sw .meta{padding:6px 8px;background:#fff}
  .sw .nm{font-size:11px;font-weight:600;letter-spacing:-.01em}
  .sw .hx{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:1px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--ink-2)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#2f7d50"></div><div class="meta"><div class="nm">success</div><div class="hx">#2f7d50</div></div></div><div class="sw"><div class="chip" style="background:#c97a1a"></div><div class="meta"><div class="nm">warning</div><div class="hx">#c97a1a</div></div></div><div class="sw"><div class="chip" style="background:#b8341c"></div><div class="meta"><div class="nm">danger</div><div class="hx">#b8341c</div></div></div><div class="sw"><div class="chip" style="background:#1a5fb4"></div><div class="meta"><div class="nm">info</div><div class="hx">#1a5fb4</div></div></div></div></body></html>
